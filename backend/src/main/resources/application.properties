# =============================================================================
# Ganpati Mandal — Application Configuration
# =============================================================================

# ─── Database (PostgreSQL + HikariCP) ────────────────────────────────────────
# These values can be overridden in production using environment variables
# e.g., DB_URL, DB_USERNAME, DB_PASSWORD
db.url=jdbc:postgresql://localhost:5432/ganpati_mandal
db.username=mandal_app
db.password=changeme
db.pool.size=10
db.pool.min.idle=5
db.pool.timeout=30000

# ─── JWT ──────────────────────────────────────────────────────────────────────
# Base64-encoded 256-bit secret — CHANGE THIS IN PRODUCTION
jwt.secret=Y2hhbmdlLXRoaXMtdG8tYS1yZWFsLTI1Ni1iaXQtc2VjcmV0LWtleS1pbi1wcm9kdWN0aW9u
jwt.expiration.hours=72

# ─── File Storage ─────────────────────────────────────────────────────────────
upload.dir=/var/mandal/uploads
upload.max.size.mb=10

# ─── OTP ──────────────────────────────────────────────────────────────────────
# In dev mode, OTP is logged to console and always accepts 123456
otp.dev.mode=true
otp.expiry.minutes=5
otp.max.attempts=5

# ─── SMS / WhatsApp (placeholder — configure when ready) ─────────────────────
sms.provider=none
sms.api.key=
whatsapp.api.key=

# ─── Mandal Defaults ─────────────────────────────────────────────────────────
mandal.receipt.prefix=GM
